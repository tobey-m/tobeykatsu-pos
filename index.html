.tile.busy{background:#fff7f1;border-color:#f0d2c0}.tiletop{display:flex;justify-content:space-between;font-weight:750;font-size:12px}.dot{width:7px;height:7px;border-radius:50%;background:#d5cec4}.busy .dot{background:var(--orange)}.tileinfo{font-size:10px;color:var(--muted);margin-top:8px}.tileprice{font-size:11px;font-weight:700;margin-top:6px}.list{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #f0ebe4;padding:10px 0}.list:last-child{border:0}.list b{font-size:11px}.list small{font-size:10px;display:block;color:var(--muted);margin-top:4px}.badge{display:inline-block;border-radius:20px;padding:5px 8px;font-size:9px;font-weight:750;background:#f0eee9;color:#766d64}.badge.orange{background:var(--soft);color:var(--orange)}.badge.green{background:var(--greenbg);color:var(--green)}.badge.red{background:var(--redbg);color:var(--red)}.alert{padding:10px 11px;background:#fff8ec;border:1px solid #f1dfbf;border-radius:10px;display:flex;gap:9px;margin-bottom:8px}.alert strong{font-size:11px}.alert small{display:block;font-size:10px;color:var(--muted);margin-top:4px}.tabs{display:flex;gap:7px;margin:0 0 14px;flex-wrap:wrap}.tab{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:8px;padding:7px 10px;font-size:10px}.tab.active{background:var(--soft);color:var(--orange);border-color:#f0d0bd;font-weight:700}.posgrid{grid-template-columns:1.2fr .8fr}.menugrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.menuitem{border:1px solid var(--line);background:white;border-radius:11px;padding:10px;cursor:pointer}.menuitem:hover{border-color:#d49672;transform:translateY(-1px)}.food{height:67px;background:linear-gradient(135deg,#ead7c4,#f6ece0);border-radius:8px;display:grid;place-items:center;font-size:30px;margin-bottom:8px}.menuitem b{display:block;font-size:11px}.menuitem small{display:block;color:var(--muted);font-size:9px;margin:4px 0 7px}.menuitem em{color:var(--orange);font-style:normal;font-weight:750;font-size:11px}.mode{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:#f9f4ed;border-radius:9px;margin-bottom:13px;font-size:11px}.cart{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f0ebe4;font-size:11px}.cart small{display:block;color:var(--muted);margin-top:4px;font-size:9px}.qty button{border:1px solid var(--line);border-radius:6px;background:white;width:22px;height:22px}.total{display:flex;justify-content:space-between;padding:13px 0;font-weight:750}.note{color:var(--muted);font-size:10px;line-height:1.5}.tickets{grid-template-columns:repeat(3,1fr)}.ticket{background:white;border:1px solid var(--line);border-radius:12px;overflow:hidden}.tickethead{background:#fff6ed;border-bottom:1px solid var(--line);padding:12px;display:flex;justify-content:space-between}.tickethead b{font-size:12px}.ticketbody{padding:12px}.ticketbody p{font-size:11px;border-bottom:1px dashed #eee6dd;padding:7px 0;margin:0}.ticketbody small{display:block;color:var(--orange);font-size:9px;margin-top:4px}.ticketfoot{padding:10px 12px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:650px;font-size:11px}th{text-align:left;color:var(--muted);font-weight:600;padding:9px;border-bottom:1px solid var(--line)}td{padding:11px 9px;border-bottom:1px solid #f0ebe4}.stockname{font-weight:700}.stocksub{display:block;font-size:9px;color:var(--muted);margin-top:4px}.bar{height:5px;width:78px;background:#eee9e2;border-radius:8px;margin-top:6px}.bar i{height:100%;display:block;border-radius:8px;background:#6c9b7b}.bar.low i{background:#d27654}.costgrid{grid-template-columns:1fr 1fr}.inputrow{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #f0ebe4;padding:11px 0;font-size:11px}.inputrow input{width:105px;border:1px solid var(--line);border-radius:7px;padding:7px;text-align:right}.metric{font-size:31px;font-weight:800;margin:10px 0}.modalback{position:fixed;inset:0;background:#21191299;z-index:8;display:grid;place-items:center;padding:18px}.modal{background:#fffdfa;width:min(460px,100%);border-radius:16px;padding:21px}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead h2{font-size:17px}.phone{max-width:330px;margin:12px auto 0;border:6px solid #2c241e;border-radius:23px;background:#fff;overflow:hidden}.phonehead{padding:13px;background:#f6ede3;text-align:center}.phonebody{padding:14px}.dish{height:110px;border-radius:11px;background:#f1e4d4;display:grid;place-items:center;font-size:43px;margin:10px 0}.mobileline{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:11px}.close{border:0;background:none;font-size:22px;color:#80766c}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#28221d;color:white;padding:10px 14px;border-radius:9px;z-index:12;font-size:11px}.empty{text-align:center;color:var(--muted);padding:23px;font-size:11px}@media(max-width:1000px){.stats{grid-template-columns:repeat(2,1fr)}.cols,.posgrid,.costgrid{grid-template-columns:1fr}.tickets{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.side{width:58px;padding:15px 6px}.brand{padding:0 1px 24px}.mark{width:44px;height:44px}.brandcopy,.label,.nav button span:not(.ico),.demo{display:none}.nav button{justify-content:center;padding:12px 0}.main{margin-left:58px}.top{height:58px;padding:0 12px}.chip{display:none}.page{padding:20px 12px}.head{align-items:flex-start;flex-direction:column;gap:10px}.head h1{font-size:21px}.menugrid{grid-template-columns:repeat(2,1fr)}.tickets{grid-template-columns:1fr}.tablegrid{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body><div id="app"><aside class="side"><div class="brand"><div class="mark">と</div><div class="brandcopy"><b>tobeykatsu</b><small>POS & INVENTORY</small></div></div><div class="label">Workspace</div><nav class="nav">
<button class="active" data-page="overview"><span class="ico">⌂</span><span>ภาพรวมร้าน</span></button><button data-page="pos"><span class="ico">▦</span><span>หน้าร้าน / ออเดอร์</span></button><button data-page="kitchen"><span class="ico">♨</span><span>หน้าจอครัว</span></button><button data-page="inventory"><span class="ico">▤</span><span>วัตถุดิบและสต็อก</span></button><button data-page="costs"><span class="ico">◒</span><span>ต้นทุนและจุดคุ้มทุน</span></button></nav><div class="demo"><div class="live">DEMO MODE</div><small>ข้อมูลตัวอย่างสำหรับลอง flow<br>ยังไม่เชื่อมฐานข้อมูลจริง</small></div></aside><main class="main"><header class="top"><div class="crumb">tobeykatsu / <b id="crumb">ภาพรวมร้าน</b></div><div class="right"><div class="chip">อังคาร 11 พฤศจิกายน 2026</div><div class="avatar">T</div></div></header><section class="page" id="content"></section></main></div><div id="modal"></div><div id="toast"></div>
<script>
const menu=[{id:'loin',name:'ทงคัตสึสันนอก',en:'Pork Loin Katsu',price:189,icon:'🍱'},{id:'chicken',name:'ทงคัตสึไก่',en:'Chicken Katsu',price:159,icon:'🍗'},{id:'don',name:'คัตสึด้ง',en:'Katsudon',price:199,icon:'🥘'},{id:'rice',name:'ข้าวผัดไข่',en:'Egg Fried Rice',price:99,icon:'🍳'},{id:'cheese',name:'ชีสละลาย',en:'Melted Cheese',price:25,icon:'🧀'},{id:'beer',name:'เบียร์สด 1 แก้ว',en:'Draft Beer',price:95,icon:'🍺'}];
let s={page:'overview',table:1,mode:'staff',cart:[],orders:[{table:2,status:'preparing',created:'18:24',items:[{id:'loin',qty:1,mods:['เพิ่มไข่']},{id:'beer',qty:1,mods:[]}]},{table:4,status:'new',created:'18:31',items:[{id:'don',qty:1,mods:[]},{id:'rice',qty:1,mods:['เพิ่มไข่']}]}],stock:[{name:'หมูสันนอก',brand:'Fresh cut · แพ็ก 1 kg',qty:3.4,unit:'kg',min:2,cost:245},{name:'เนื้อไก่',brand:'Chicken breast · แพ็ก 1 kg',qty:1.2,unit:'kg',min:2,cost:112},{name:'ไข่ไก่',brand:'เบอร์ 2 · แผง 30 ฟอง',qty:18,unit:'ฟอง',min:12,cost:4.5},{name:'เกล็ดขนมปัง',brand:'ถุง 1 kg',qty:.7,unit:'kg',min:1,cost:95},{name:'น้ำมันทอด',brand:'ขวด 5 L',qty:2.2,unit:'L',min:1.5,cost:155},{name:'ชีสมอสซาเรลลา',brand:'แพ็ก 500 g',qty:.3,unit:'kg',min:.5,cost:330}],waste:[]};
const names={overview:'ภาพรวมร้าน',pos:'หน้าร้าน / ออเดอร์',kitchen:'หน้าจอครัว',inventory:'วัตถุดิบและสต็อก',costs:'ต้นทุนและจุดคุ้มทุน'};
function money(n){return '฿'+Number(n||0).toLocaleString('th-TH',{maximumFractionDigits:0})}function dish(id){return menu.find(x=>x.id===id)}function total(o){return o.items.reduce((a,x)=>a+dish(x.id).price*x.qty,0)}
function toast(t){document.getElementById('toast').innerHTML='<div class="toast">'+t+'</div>';setTimeout(()=>document.getElementById('toast').innerHTML='',2200)}
function go(p){s.page=p;document.getElementById('crumb').textContent=names[p];document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===p));draw()}
document.querySelectorAll('.nav button').forEach(x=>x.onclick=()=>go(x.dataset.page));
function head(k,t,d,a){return '<div class="head"><div><div class="eyebrow">'+k+'</div><h1>'+t+'</h1><div class="sub">'+d+'</div></div><div>'+a+'</div></div>'}
function tablegrid(){return '<div class="tablegrid">'+[1,2,3,4,5,6].map(n=>{let o=s.orders.find(x=>x.table===n);return '<div class="tile '+(o?'busy':'')+'" onclick="openTable('+n+')"><div class="tiletop">โต๊ะ '+String(n).padStart(2,'0')+'<i class="dot"></i></div><div class="tileinfo">'+(o?'เปิดบิล · '+o.items.length+' รายการ':'ว่าง · 2 ที่นั่ง')+'</div><div class="tileprice">'+(o?money(total(o)):'กดเพื่อเปิดโต๊ะ')+'</div></div>'}).join('')+'</div>'}
function draw(){let c=document.getElementById('content');c.innerHTML=s.page==='overview'?overview():s.page==='pos'?pos():s.page==='kitchen'?kitchen():s.page==='inventory'?inventory():costs();if(s.page==='costs')calc()}
function overview(){let pending=s.orders.filter(o=>o.status==='new').length;return head('OWNER DASHBOARD','สวัสดีครับ ร้านพร้อมแล้ว','ภาพรวมการทำงานวันนี้ · ตัวเลขตัวอย่างสำหรับทดลองระบบ','<button class="btn primary" onclick="go(\'pos\')">＋ เปิดโต๊ะ / รับออเดอร์</button>')+'<div class="grid stats"><div class="stat"><div class="statline">ยอดขายวันนี้ <span class="bubble">฿</span></div><strong>'+money(2410+s.orders.reduce((a,o)=>a+total(o),0))+'</strong><div class="good">↑ 12% จากวันก่อน</div></div><div class="stat"><div class="statline">ออเดอร์วันนี้ <span class="bubble">▣</span></div><strong>'+(6+s.orders.length)+'</strong><div class="good">เฉลี่ย ฿176 / บิล</div></div><div class="stat"><div class="statline">โต๊ะที่กำลังใช้ <span class="bubble">▦</span></div><strong>'+s.orders.length+' / 6</strong><div class="good">โต๊ะว่าง '+(6-s.orders.length)+' โต๊ะ</div></div><div class="stat"><div class="statline">สต็อกต้องเช็ก <span class="bubble">!</span></div><strong>'+s.stock.filter(x=>x.qty<x.min).length+'</strong><div class="good" style="color:var(--orange)">ดูรายการสั่งซื้อ</div></div></div><div class="grid cols"><div><div class="panel"><div class="paneltitle"><h2>โต๊ะและออเดอร์ที่เปิดอยู่</h2><button class="btn small" onclick="go(\'pos\')">จัดการโต๊ะ →</button></div>'+tablegrid()+'</div><div class="panel"><div class="paneltitle"><h2>ออเดอร์ล่าสุด</h2><span>ส่งเข้าครัวแล้ว</span></div>'+s.orders.map(o=>'<div class="list"><div><b>โต๊ะ '+String(o.table).padStart(2,'0')+'</b><small>'+o.items.length+' รายการ · '+o.created+'</small></div><div><b>'+money(total(o))+'</b> &nbsp;<span class="badge '+(o.status==='new'?'orange':'green')+'">'+(o.status==='new'?'รอครัว':'กำลังทำ')+'</span></div></div>').join('')+'</div></div><div><div class="panel"><div class="paneltitle"><h2>ต้องเช็กสต็อก</h2><button class="btn small" onclick="go(\'inventory\')">ดูทั้งหมด</button></div>'+s.stock.filter(x=>x.qty<x.min*1.3).slice(0,4).map(x=>'<div class="alert"><div>⚠</div><div><strong>'+x.name+' · เหลือ '+x.qty+' '+x.unit+'</strong><small>ขั้นต่ำ '+x.min+' '+x.unit+' · '+money(x.cost)+' / '+x.unit+'</small></div></div>').join('')+'<p class="note">ตัวอย่างรายการซื้อ · ควรหักของที่สั่งแล้วก่อนคำนวณ</p></div><div class="panel"><div class="paneltitle"><h2>สถานะครัว</h2><button class="btn small" onclick="go(\'kitchen\')">เปิด KDS</button></div><div class="list"><div><b>ออเดอร์ใหม่</b><small>รอรับเข้าครัว</small></div><span class="badge orange">'+pending+'</span></div><div class="list"><div><b>กำลังปรุง</b><small>ยังไม่เสิร์ฟ</small></div><span class="badge green">'+s.orders.filter(o=>o.status==='preparing').length+'</span></div></div></div></div>'}
function pos(){let o=s.orders.find(x=>x.table===s.table);return head('FRONT OF HOUSE','รับออเดอร์','QR ลูกค้าและหน้ารับออเดอร์ของคุณใช้บิลโต๊ะเดียวกัน','<button class="btn softbtn" onclick="showQR()">▣ ดูหน้าลูกค้าสแกน QR</button>')+'<div class="mode"><span><b>'+(s.mode==='staff'?'โหมดพนักงาน':'เพิ่มจาก QR')+'</b> · โต๊ะ '+String(s.table).padStart(2,'0')+(o?' · บิลเปิดอยู่':' · เลือกเมนูเพื่อเริ่มบิล')+'</span><span class="badge '+(o?'green':'')+'">'+(o?'บิลเปิดอยู่':'โต๊ะว่าง')+'</span></div><div class="grid posgrid"><div><div class="panel"><div class="paneltitle"><h2>เลือกโต๊ะ</h2><span>กดโต๊ะว่างเพื่อเปิดบิล</span></div>'+tablegrid()+'</div><div class="panel"><div class="paneltitle"><h2>เมนู</h2><span>แตะเมนูเพื่อเพิ่มในบิล</span></div><div class="tabs"><button class="tab active">ทั้งหมด</button><button class="tab">เมนูหลัก</button><button class="tab">ท็อปปิง</button><button class="tab">เครื่องดื่ม</button></div><div class="menugrid">'+menu.map(x=>'<div class="menuitem" onclick="add(\''+x.id+'\')"><div class="food">'+x.icon+'</div><b>'+x.name+'</b><small>'+x.en+'</small><em>'+money(x.price)+'</em></div>').join('')+'</div></div></div><div class="panel"><div class="paneltitle"><h2>บิลโต๊ะ '+String(s.table).padStart(2,'0')+'</h2><span>รายการ QR + พนักงาน</span></div>'+(o?o.items.map(x=>'<div class="cart"><div>'+dish(x.id).name+'<small>'+(x.mods.join(' · ')||'ปกติ')+'</small></div><b>×'+x.qty+' · '+money(dish(x.id).price*x.qty)+'</b></div>').join(''):'<div class="empty">เริ่มบิลด้วยการเลือกเมนู</div>')+s.cart.map((x,i)=>'<div class="cart"><div>'+dish(x.id).name+'<small>รายการใหม่</small></div><div class="qty"><button onclick="qty('+i+',-1)">−</button> '+x.qty+' <button onclick="qty('+i+',1)">＋</button></div></div>').join('')+'<div class="total"><span>ยอดรวม</span><span>'+money((o?total(o):0)+s.cart.reduce((a,x)=>a+dish(x.id).price*x.qty,0))+'</span></div><button class="btn primary" style="width:100%" onclick="send()">ส่งออเดอร์เข้าครัว →</button><p class="note">รายการจาก QR หรือพนักงานจะรวมในบิลโต๊ะนี้</p></div></div>'}
function kitchen(){return head('KITCHEN DISPLAY','หน้าจอครัว','เรียงตามเวลารับออเดอร์ · กดเปลี่ยนสถานะเมื่อเสร็จ','<span class="badge green">● ครัวเปิด</span>')+'<div class="tabs"><button class="tab active">ออเดอร์ทั้งหมด ('+s.orders.length+')</button><button class="tab">ใหม่ ('+s.orders.filter(o=>o.status==='new').length+')</button><button class="tab">กำลังทำ ('+s.orders.filter(o=>o.status==='preparing').length+')</button></div><div class="grid tickets">'+(s.orders.length?s.orders.map(o=>'<div class="ticket"><div class="tickethead"><b>โต๊ะ '+String(o.table).padStart(2,'0')+'</b><span class="badge '+(o.status==='new'?'orange':'green')+'">'+(o.status==='new'?'ออเดอร์ใหม่':'กำลังปรุง')+'</span></div><div class="ticketbody"><div class="note">รับออเดอร์ '+o.created+' · dine in</div>'+o.items.map(x=>'<p><b>'+x.qty+'× '+dish(x.id).name+'</b>'+(x.mods.length?'<small>↳ '+x.mods.join(' · ')+'</small>':'')+'</p>').join('')+'</div><div class="ticketfoot"><span class="note">เวลาทำ <b style="color:var(--ink)">12 นาที</b></span><button class="btn small '+(o.status==='new'?'primary':'')+'" onclick="advance('+o.table+')">'+(o.status==='new'?'รับออเดอร์':'ทำเสร็จแล้ว')+'</button></div></div>').join(''):'<div class="panel empty">ยังไม่มีออเดอร์</div>')+'</div>'}
function inventory(){return head('INVENTORY','วัตถุดิบและสต็อก','หน่วยซื้อ → หน่วยใช้ · ทดลองแจ้งเตือนและบันทึกของเสีย','<button class="btn primary" onclick="receive()">＋ รับของเข้า</button>')+'<div class="grid stats"><div class="stat"><div class="statline">วัตถุดิบ <span class="bubble">▤</span></div><strong>'+s.stock.length+'</strong><div class="good">มีหน่วยซื้อและหน่วยใช้</div></div><div class="stat"><div class="statline">ต่ำกว่าขั้นต่ำ <span class="bubble">!</span></div><strong>'+s.stock.filter(x=>x.qty<x.min).length+'</strong><div class="good" style="color:var(--orange)">ควรตรวจสอบก่อนสั่ง</div></div><div class="stat"><div class="statline">มูลค่าสต็อกตัวอย่าง <span class="bubble">฿</span></div><strong>'+money(s.stock.reduce((a,x)=>a+x.qty*x.cost,0))+'</strong><div class="good">คิดจากต้นทุนต่อหน่วยใช้</div></div><div class="stat"><div class="statline">Waste log <span class="bubble">↘</span></div><strong>'+s.waste.length+'</strong><div class="good">บันทึกในรอบนี้</div></div></div><div class="panel"><div class="paneltitle"><h2>รายการวัตถุดิบ</h2><span>กด “บันทึกเสีย” เพื่อลองตัดยอด</span></div><div class="tablewrap"><table><thead><tr><th>วัตถุดิบ</th><th>คงเหลือ</th><th>ขั้นต่ำ</th><th>สถานะ</th><th>ต้นทุน/หน่วยใช้</th><th></th></tr></thead><tbody>'+s.stock.map((x,i)=>'<tr><td><span class="stockname">'+x.name+'</span><span class="stocksub">ซื้อเป็นแพ็ก → ใช้เป็น '+x.unit+' · '+x.brand+'</span></td><td><b>'+x.qty+' '+x.unit+'</b><div class="bar '+(x.qty<x.min?'low':'')+'"><i style="width:'+Math.min(100,x.qty/x.min*50)+'%"></i></div></td><td>'+x.min+' '+x.unit+'</td><td><span class="badge '+(x.qty<x.min?'red':'green')+'">'+(x.qty<x.min?'ควรสั่งซื้อ':'ปกติ')+'</span></td><td>'+money(x.cost)+' / '+x.unit+'</td><td><button class="btn small" onclick="waste('+i+')">บันทึกเสีย</button></td></tr>').join('')+'</tbody></table></div></div><div class="grid cols"><div class="panel"><div class="paneltitle"><h2>Require list · ตัวอย่าง</h2><span>ปัดขึ้นเป็นหน่วยซื้อ</span></div>'+s.stock.filter(x=>x.qty<x.min*1.3).map(x=>'<div class="list"><div><b>'+x.name+'</b><small>คงเหลือ '+x.qty+' '+x.unit+' · ซื้อเป็นแพ็ก</small></div><div style="text-align:right"><b>2 แพ็ก</b><small>'+money(x.cost*2*x.min)+' โดยประมาณ</small></div></div>').join('')+'<p class="note">ระบบจริงควรหักของที่สั่งแล้ว ตรวจอายุสินค้าและจำนวนสั่งขั้นต่ำด้วย</p></div><div class="panel"><div class="paneltitle"><h2>Waste log</h2><span>รายการล่าสุด</span></div>'+(s.waste.length?s.waste.map(w=>'<div class="list"><div><b>'+w.name+' · '+w.qty+' '+w.unit+'</b><small>'+w.reason+'</small></div><span class="badge red">−'+money(w.value)+'</span></div>').join(''):'<div class="empty">ยังไม่มีของเสียที่บันทึก</div>')+'</div></div>'}
function costs(){return head('COST & CVP','ต้นทุนและจุดคุ้มทุน','ตัวเลขตั้งต้นเป็นตัวอย่าง · ปรับได้เมื่อมีต้นทุนจริง','<span class="badge">แบบจำลองเบื้องต้น</span>')+'<div class="grid costgrid"><div class="panel"><div class="paneltitle"><h2>ค่าใช้จ่ายและสมมติฐาน</h2><span>แก้ตัวเลขเพื่อดูผล</span></div><div class="inputrow">ค่าเช่า<input id="rent" type="number" value="12000" oninput="calc()"></div><div class="inputrow">ค่าแรง<input id="labor" type="number" value="18000" oninput="calc()"></div><div class="inputrow">ค่าน้ำ / ไฟ / แก๊ส<input id="utilities" type="number" value="6500" oninput="calc()"></div><div class="inputrow">ค่าใช้จ่ายอื่น<input id="other" type="number" value="3500" oninput="calc()"></div><div class="inputrow">ยอดขายเฉลี่ย / จาน<input id="price" type="number" value="175" oninput="calc()"></div><div class="inputrow">ต้นทุนผันแปร / จาน<input id="variable" type="number" value="68" oninput="calc()"></div><p class="note">ตัวอย่างเฉลี่ยอย่างง่าย ก่อนเปิดร้านควรแยกต้นทุนแต่ละเมนูและสัดส่วนขาย</p></div><div><div class="panel"><div class="paneltitle"><h2>ผลจำลอง CVP</h2><span>รายเดือน</span></div><div class="note">ค่าใช้จ่ายคงที่รวม</div><div class="metric" id="fixed">฿40,000</div><div class="list"><div><b>กำไรส่วนเกิน / จาน</b><small>ราคาขาย − ต้นทุนผันแปร</small></div><b id="contrib">฿107</b></div><div class="list"><div><b>จุดคุ้มทุนโดยประมาณ</b><small>จำนวนจานต่อเดือน</small></div><b id="break">374 จาน</b></div><div class="list"><div><b>ยอดขาย ณ จุดคุ้มทุน</b><small>ก่อนภาษีและค่าใช้จ่ายที่ยังไม่ใส่</small></div><b id="salesbreak">฿65,450</b></div></div><div class="panel"><div class="paneltitle"><h2>ต้นทุนจริงต่อจาน</h2><span>ข้อมูลที่ต้องเก็บ</span></div><div class="list"><div><b>วัตถุดิบตามสูตร</b><small>หมู / แป้ง / ไข่ / เกล็ดขนมปัง</small></div><b>รอเก็บข้อมูล</b></div><div class="list"><div><b>พลังงานและน้ำมัน</b><small>จากเวลาปรุงหรือบันทึกจริง</small></div><b>รอเก็บข้อมูล</b></div><div class="list"><div><b>ของเสียและทำใหม่</b><small>อ้างอิง Waste log</small></div><b>รอเก็บข้อมูล</b></div></div></div></div>'}
function openTable(n){s.table=n;s.mode='staff';if(!s.orders.find(x=>x.table===n))toast('เลือกโต๊ะ '+String(n).padStart(2,'0'));draw()}function add(id){s.cart.push({id:id,qty:1});draw()}function qty(i,d){s.cart[i].qty+=d;if(!s.cart[i].qty)s.cart.splice(i,1);draw()}
function send(){if(!s.cart.length){toast('เลือกเมนูก่อนส่งเข้าครัว');return}let o=s.orders.find(x=>x.table===s.table);if(!o){o={table:s.table,status:'new',created:new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}),items:[]};s.orders.push(o)}s.cart.forEach(x=>o.items.push({...x,mods:[]}));o.status='new';s.cart=[];toast('ส่งเข้าครัวแล้ว · โต๊ะ '+s.table);go('kitchen')}
function advance(n){let o=s.orders.find(x=>x.table===n);if(o.status==='new'){o.status='preparing';toast('ครัวรับออเดอร์โต๊ะ '+n+' แล้ว')}else{s.orders=s.orders.filter(x=>x.table!==n);toast('ทำเสร็จแล้ว · โต๊ะ '+n+' ปิดรายการครัว')}draw()}
function showQR(){document.getElementById('modal').innerHTML='<div class="modalback" onclick="closeModal(event)"><div class="modal" onclick="event.stopPropagation()"><div class="modalhead"><h2>ลูกค้าสแกน QR</h2><button class="close" onclick="closeModal()">×</button></div><div class="sub">โต๊ะ '+String(s.table).padStart(2,'0')+' · ราคาเดียวกับหน้าร้าน</div><div class="phone"><div class="phonehead"><b>と tobeykatsu</b><div class="note">TABLE '+String(s.table).padStart(2,'0')+'</div></div><div class="phonebody"><div class="eyebrow">TONKATSU FAVORITES</div><div class="dish">🍱</div><b>ทงคัตสึสันนอก</b><div class="mobileline"><span>ทงคัตสึสันนอก</span><b>฿189</b></div><div class="mobileline"><span>เพิ่มชีส</span><b>+฿25</b></div><div class="mobileline"><span>ยอดก่อนยืนยัน</span><b>฿214</b></div><button class="btn primary" style="width:100%;margin-top:12px" onclick="qrAdd()">เพิ่มลงบิลโต๊ะนี้</button></div></div><p class="note" style="text-align:center">แอนิเมชัน topping ข้ามได้ · ออเดอร์เข้าบิลโต๊ะเดียวกับพนักงาน</p></div></div>'}
function closeModal(e){if(!e||e.target.classList.contains('modalback'))document.getElementById('modal').innerHTML=''}function qrAdd(){s.cart.push({id:'loin',qty:1});s.mode='qr';closeModal();toast('เพิ่มจาก QR ลงบิลโต๊ะ '+s.table+' แล้ว');draw()}
function waste(i){let x=s.stock[i],n=Number(prompt('จำนวนของเสีย ('+x.unit+')',x.unit==='kg'?'0.2':'1'));if(!n||n<0)return;x.qty=Math.max(0,+(x.qty-n).toFixed(2));s.waste.unshift({name:x.name,qty:n,unit:x.unit,reason:'เสียหาย / ตกหล่น (ทดลอง)',value:n*x.cost});draw();toast('บันทึกของเสียแล้ว')}
function receive(){s.stock[0].qty+=1;draw();toast('รับของเข้าตัวอย่าง +1 kg')}
function calc(){let v=id=>Number(document.getElementById(id)?.value||0),fixed=v('rent')+v('labor')+v('utilities')+v('other'),con=v('price')-v('variable'),be=con>0?Math.ceil(fixed/con):0;document.getElementById('fixed').textContent=money(fixed);document.getElementById('contrib').textContent=money(con);document.getElementById('break').textContent=be.toLocaleString()+' จาน';document.getElementById('salesbreak').textContent=money(be*v('price'))}
draw();
</script></body></html>
